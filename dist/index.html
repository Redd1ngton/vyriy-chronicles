<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142d2b"><meta name="description" content="Вирій: пригода одного героя у Вербовому прикордонні. Українська RPG із боями, спеціалізаціями й кооперативним сервером."><title>Вирій · Вербове прикордоння</title><link rel="stylesheet" href="style.css"></head><body><main id="game-shell"><div id="scene" aria-label="Ізометричний світ. Рух: WASD або дотик до землі."></div><div class="vignette"></div>
<header class="hud-top"><button id="hero-open" class="player-hud" aria-label="Персонаж і характеристики"><span id="hero-art" class="hero-art"></span><span class="hero-vitals"><span><b id="hero-name">Мандрівник</b><small id="hero-level">1</small></span><span class="vital hp"><i id="hp-fill"></i><em id="hp-value"></em></span><span class="vital sp"><i id="sp-fill"></i><em id="sp-value"></em></span><span class="xp"><i id="xp-fill"></i></span></span></button><div class="location"><p>В И Р І Й</p><h1 id="location-name">Вербове прикордоння</h1><span id="mode-label">Локальний режим · один герой</span></div><div class="top-actions"><button id="world-map" aria-label="Карта регіону">◈<span>Карта</span></button><button id="coop-open" aria-label="Кооператив">♧<span>Кооп</span></button><button id="menu-open" aria-label="Налаштування">☰<span>Меню</span></button></div></header>
<section id="quest-hud" class="quest-hud"><button id="quest-open"><span class="eyebrow">РОЗДІЛ I · ПОВЕРНЕННЯ СВІТЛА</span><b id="quest-heading">Три втрачені печатки</b><span id="quest-objective">Поговоріть із Берегинею Орисею</span></button><div id="party-hud"></div></section>
<div id="target-hud" hidden></div><div id="status-hud" aria-label="Активні стани"></div><div id="cast-hud" hidden><span id="cast-label"></span><i id="cast-fill"></i></div><div id="toast" role="status"></div><div id="event-log" aria-live="polite"></div>
<div id="vote-hud" hidden><span class="eyebrow">РІШЕННЯ ГРУПИ</span><b id="vote-title"></b><span id="vote-count"></span><div><button id="vote-yes">За</button><button id="vote-no">Проти</button></div></div>
<div id="death-hud" hidden><p class="eyebrow">ШЛЯХ ЩЕ НЕ ЗАВЕРШЕНО</p><h2>Ваше світло згасло</h2><p id="death-reason"></p><button id="respawn">Повернутися до входу</button><small>Предмети та досвід збережено</small></div>
<div id="joystick" aria-label="Сенсорний джойстик руху"><span></span><i id="joy-knob"></i></div><div class="controls-hint">WASD · рух <span>Пробіл · атака</span> E · взаємодія</div>
<nav class="actionbar" aria-label="Бойові дії"><button id="attack" class="action attack"><b>⚔</b><span>Атака</span><kbd>SPACE</kbd></button><button id="skill0" class="action"><b>✦</b><span>Прийом I</span><kbd>1</kbd><em></em></button><button id="skill1" class="action"><b>⬡</b><span>Прийом II</span><kbd>2</kbd><em></em></button><button id="potion" class="action potion"><b>♜</b><span>Зілля</span><kbd>3</kbd><em></em></button><button id="interact" class="action interact"><b>✋</b><span>Взаємодія</span><kbd>E</kbd></button></nav><nav class="utilitybar"><button id="inventory-open">▧ <span>Торба</span><i id="bag-count"></i></button><button id="spec-open">✧ <span>Розвиток</span></button><button id="help-open">? <span>Порадник</span></button></nav><span id="save-status">Прогрес зберігається на цьому пристрої</span>
<dialog id="modal"><div class="modal-header"><div><p class="eyebrow" id="modal-kicker">ХРОНІКИ ОБЕРЕГУ</p><h2 id="modal-title"></h2></div><button id="modal-close" aria-label="Закрити">×</button></div><div id="modal-body"></div></dialog>
</main><script src="assets/phaser-3.90.0.min.js"></script><script type="module" src="ui/app.js"></script></body></html>
