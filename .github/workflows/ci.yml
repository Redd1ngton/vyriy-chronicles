name: RPG checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  deployed-site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check real Cloudflare deployment
        run: node scripts/smoke-deployed.mjs https://vyriy.lepra-soa.workers.dev
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Play the deployed game in desktop Chromium and mobile WebKit
        run: node scripts/browser-smoke.mjs https://vyriy.lepra-soa.workers.dev
      - name: Check seasonal regions, bosses, inventory sales and soul tuning in isolated saves
        run: node scripts/browser-expansion.mjs https://vyriy.lepra-soa.workers.dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-startup-evidence
          path: browser-evidence/
