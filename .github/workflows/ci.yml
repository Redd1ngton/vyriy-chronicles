name: RPG checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  deployed-site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check real Cloudflare deployment
        run: node scripts/smoke-deployed.mjs https://vyriy.lepra-soa.workers.dev
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Play the deployed game in desktop Chromium and mobile WebKit
        run: node scripts/browser-smoke.mjs https://vyriy.lepra-soa.workers.dev
      - name: Verify trial rewards, cosmetics and crafting
        run: node scripts/browser-trials.mjs https://vyriy.lepra-soa.workers.dev
      - name: Check seasonal regions, bosses, inventory sales and soul tuning in isolated saves
        run: node scripts/browser-expansion.mjs https://vyriy.lepra-soa.workers.dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-startup-evidence
          path: browser-evidence/

  journey-systems:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for the current Cloudflare release
        run: node scripts/smoke-deployed.mjs https://vyriy.lepra-soa.workers.dev
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Play boss mechanics, dungeon choices, relics, storage and journey events
        run: node scripts/browser-journeys.mjs https://vyriy.lepra-soa.workers.dev
      - name: Verify factions, homestead, secrets, hunting and protected inventory
        run: node scripts/browser-living-world.mjs https://vyriy.lepra-soa.workers.dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-systems-evidence
          path: journey-evidence/

  living-world-preview:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Test the built game independently of hosting availability
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/vyriy-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          task_test_status=0
          node scripts/browser-smoke.mjs http://127.0.0.1:4173 || task_test_status=1
          node scripts/browser-trials.mjs http://127.0.0.1:4173 || task_test_status=1
          node scripts/browser-living-world.mjs http://127.0.0.1:4173 || task_test_status=1
          exit "$task_test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-world-preview-evidence
          path: |
            journey-evidence/
            browser-evidence/
